# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Fonts for the link-preview card, first match wins. A bundled file would go
    # first; after that the usual Linux and macOS locations, so the card works on
    # the server and on a dev machine without anything vendored.
    app.game_card.fonts:
        regular:
            - '%kernel.project_dir%/assets/fonts/card-regular.ttf'
            - '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
            - '/usr/share/fonts/dejavu/DejaVuSans.ttf'
            - '/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf'
            - '/System/Library/Fonts/Supplemental/Arial.ttf'
        bold:
            - '%kernel.project_dir%/assets/fonts/card-bold.ttf'
            - '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
            - '/usr/share/fonts/dejavu/DejaVuSans-Bold.ttf'
            - '/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf'
            - '/System/Library/Fonts/Supplemental/Arial Bold.ttf'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

# The projector writes into the web root. Under test that would mean the real
# public/ directory, where a test run would overwrite the read models a dev is
# looking at — so it writes into the cache directory instead.
when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Game\Infrastructure\GameProjector:
            arguments:
                $webRoot: '%kernel.cache_dir%/public'
